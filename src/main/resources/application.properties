spring.application.name=ms-barriodigital-rabbit-admin
server.port=8083
spring.config.import=optional:file:../.env[.properties]

# Conexion AMQP para crear y borrar recursos.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# API HTTP de RabbitMQ Management para listar y verificar exchanges.
rabbitmq.management.url=${RABBITMQ_MANAGEMENT_URL:http://localhost:15672}
