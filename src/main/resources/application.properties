spring.application.name=ms-barriodigital-rabbit-admin
server.port=8083

# Carga las variables del .env de la raiz del proyecto si existe (desarrollo local)
spring.config.import=optional:file:../.env[.properties]

# ========== CONEXION A RABBITMQ (AMQP) ==========
# La usa RabbitAdmin para crear y borrar colas, exchanges y bindings
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# ========== API HTTP DE MANAGEMENT ==========
# RabbitAdmin no sabe listar colas ni exchanges; para eso se usa la API REST del plugin de management
rabbitmq.management.url=${RABBITMQ_MANAGEMENT_URL:http://localhost:15672}
